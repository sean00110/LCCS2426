<script>
function addData(){
    var fN = document.getElementById("firstNameIn").value;
    var lN = document.getElementById("lastNameIn").value;
    var age = document.getElementById("ageIn").value;
	var dateOBirth = document.getElementById("dateIn").value;
	var phoneNumber = document.getElementById("phoneIn").value;
  
    var myDB = firebase.database().ref();
    var addRecord = myDB.child("Employees").push();

    record = 
      {
        "firstName" : fN,
        "lastName"  : lN,
        "age"       : age,
		"dob"		: dateOBirth,
		"phoneNum"	: phoneNumber
      }
    addRecord.set(record);
}
</script>
